name: aec-erp-prod

# Production stack — cloud deploy aec.app.id
# Reverse-proxy (nginx) di depan web & api, TLS via Let's Encrypt.
# web & api di-build dari apps/ (Dockerfile multi-stage).

services:
  api:
    build: ../../apps/api
    container_name: aec-api-prod
    restart: unless-stopped
    env_file: .env.prod
    expose:
      - '3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/v1/health/ready || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  web:
    build: ../../apps/web
    container_name: aec-web-prod
    restart: unless-stopped
    expose:
      - '80'
    depends_on:
      - api

  worker:
    build: ../../apps/api
    container_name: aec-worker-prod
    restart: unless-stopped
    command: ['sh', '-c', 'npx tsx src/worker.ts']
    env_file: .env.prod
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  postgres:
    image: postgres:16-alpine
    container_name: aec-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aec-redis-prod
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: aec-nginx-prod
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot-webroot:/var/www/certbot
    depends_on:
      - web
      - api

  certbot:
    image: certbot/certbot
    container_name: aec-certbot-prod
    restart: unless-stopped
    volumes:
      - certbot-webroot:/var/www/certbot
      - ./nginx/certs:/etc/nginx/certs:ro
    entrypoint: sh -c 'sleep infinity'

volumes:
  postgres-data:
  redis-data:
  certbot-webroot:
