name: aec-erp-dev

# Development stack — PRD §35.1: web, api, worker, postgres, redis, minio, keycloak
# `web` dan `api` dijalankan via pnpm dev (hot reload) — compose hanya infra.
# Untuk full stack containerized, uncomment profile: full

services:
  postgres:
    image: postgres:16-alpine
    container_name: aec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aec
      POSTGRES_PASSWORD: aec_dev_password
      POSTGRES_DB: aec_erp
    ports:
      # Bind ke loopback saja: container tetap bisa diakses dari host (API/seed
      # jalan native di host), tapi tidak terekspos ke internet. `ufw` TIDAK
      # melindungi port Docker karena Docker menulis aturan iptables sendiri.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aec -d aec_erp']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aec-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: aec-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: aec
      MINIO_ROOT_PASSWORD: aec_dev_password
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: aec-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/aec_erp
      KC_DB_USERNAME: aec
      KC_DB_PASSWORD: aec_dev_password
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e "GET /realms/master HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep -q "200 OK"']
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
