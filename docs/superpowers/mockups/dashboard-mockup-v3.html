<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AEC ERP — Control Tower v3</title>
<style>
/* AEC ERP · Control Tower v3
   Prinsip (dari skills):
   - hierarchy-spatial: satu blok dominan 2-4x; bukan grid sel setara
   - proximity: struktur dari JARAK, bukan border di mana-mana
   - swiss-design: 12 kolom, 8px unit, hierarki via opacity
   - no-slop-ui: tanpa metric-card grid, tanpa glow/gradien
   Container hanya untuk tabel & list. Chart menempel kanvas (bleed). */
:root{
  --n50:#fafafa; --n100:#f4f4f5; --n200:#e4e4e7; --n300:#d4d4d8; --n400:#a1a1aa;
  --n500:#71717a; --n600:#52525b; --n700:#3f3f46; --n800:#27272a; --n900:#18181b;
  --brand:#dc2626; --brand-h:#b91c1c; --brand-tint:#fef2f2;
  --pos:#15803d; --pos-fill:#22c55e; --pos-tint:#f0fdf4;
  --warn:#b45309; --warn-fill:#f59e0b; --warn-tint:#fffbeb;
  --crit:#b91c1c; --crit-fill:#ef4444; --crit-tint:#fef2f2;
  --info:#1d4ed8; --info-fill:#3b82f6; --info-tint:#eff6ff;
  --neut:#71717a;
  --cat1:#2563eb; --cat2:#d97706; --cat3:#0891b2; --cat4:#7c3aed; --cat5:#71717a; --cat6:#be185d;
  --ag1:#16a34a; --ag2:#65a30d; --ag3:#ca8a04; --ag4:#ea580c; --ag5:#b91c1c;
  --canvas:#f4f4f5; --raised:#fff; --sunken:#fafafa; --bd:#e4e4e7; --bd-strong:#d4d4d8;
  --ink:#18181b; --ink70:rgba(24,24,27,.70); --ink50:rgba(24,24,27,.50); --ink34:rgba(24,24,27,.34);
  --r:6px;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono','JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.pos{color:var(--pos);} .neg{color:var(--crit);} .i70{color:var(--ink70);} .i50{color:var(--ink50);} .i34{color:var(--ink34);}
.lbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink50);font-weight:600;}

/* shell */
.app{display:flex;min-height:100vh;}
.side{width:220px;flex:0 0 220px;background:var(--raised);border-right:1px solid var(--bd);display:flex;flex-direction:column;}
.brand{height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--bd);}
.brand .mk{width:24px;height:24px;border-radius:4px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:600;}
.brand b{font-size:14px;font-weight:600;}
.nav{padding:8px;flex:1;overflow:auto;}
.nav .g{padding:10px 10px 4px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink34);}
.nav a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:4px;color:var(--ink70);text-decoration:none;font-size:13px;}
.nav a:hover{background:var(--n50);color:var(--ink);}
.nav a.on{background:var(--n100);color:var(--ink);font-weight:500;}
.nav a .n{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--warn);background:var(--warn-tint);border-radius:3px;padding:0 5px;}
.nav .ft{padding:10px 16px;border-top:1px solid var(--bd);font-size:11px;color:var(--ink34);}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.bar{height:48px;flex:0 0 48px;background:var(--raised);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:20;}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;}
.crumb .p{color:var(--ink50);} .crumb .s{color:var(--ink34);} .crumb .c{font-weight:600;}
.grow{flex:1;}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:4px;font-size:11px;border:1px solid var(--bd-strong);color:var(--ink70);}
.chip.env{border-color:var(--warn);color:var(--warn);font-weight:600;letter-spacing:.04em;}
.chip.k{font-family:var(--mono);}
.ico{width:30px;height:30px;border-radius:4px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink50);cursor:pointer;position:relative;font-size:12px;}
.ico:hover{background:var(--n100);color:var(--ink);}
.ico .nb{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--brand);color:#fff;font-size:9px;font-weight:600;display:grid;place-items:center;}
.live{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--pos);}
.live .b{width:6px;height:6px;border-radius:50%;background:var(--pos-fill);}
.live.paused{color:var(--ink50);} .live.paused .b{background:var(--neut);}
.av{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:600;}

/* content */
.wrap{padding:16px 20px 48px;max-width:1680px;width:100%;margin:0 auto;}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:12px;}
.phead h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;}
.phead .sub{margin:3px 0 0;font-size:12px;color:var(--ink50);}
.tools{display:flex;align-items:center;gap:8px;}
.seg{display:inline-flex;border:1px solid var(--bd-strong);border-radius:4px;overflow:hidden;}
.seg button{border:0;background:var(--raised);font:inherit;font-size:12px;padding:4px 10px;color:var(--ink70);cursor:pointer;border-left:1px solid var(--bd);}
.seg button:first-child{border-left:0;}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:500;}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:4px;border:1px solid var(--bd-strong);background:var(--raised);color:var(--ink70);font:inherit;font-size:12px;cursor:pointer;}
.btn:hover{background:var(--n50);color:var(--ink);}

/* section: struktur dari JARAK + rule tipis, bukan kotak */
.sec{margin-top:26px;}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;}
.sec-h .name{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink);}
.sec-h .cnt{font-family:var(--mono);font-size:11px;color:var(--ink50);}
.sec-h .rule{flex:1;height:1px;background:var(--bd);}
.sec-h .r{display:flex;gap:12px;align-items:center;font-size:11px;color:var(--ink50);}
.newbadge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--brand-h);background:var(--brand-tint);border-radius:3px;padding:1px 6px;opacity:0;transition:opacity .2s ease;}
.newbadge.on{opacity:1;}

/* grid tanpa border antar-sel: hanya JARAK */
.g{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;}
.s3{grid-column:span 3} .s4{grid-column:span 4} .s5{grid-column:span 5}
.s6{grid-column:span 6} .s7{grid-column:span 7} .s8{grid-column:span 8} .s12{grid-column:span 12}
@media (max-width:1100px){.g{grid-template-columns:1fr;} [class^="s"]{grid-column:span 1 !important;}}

/* blok: chart BLEED (tanpa kartu) */
.blk{min-width:0;display:flex;flex-direction:column;}
.blk-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;}
.blk-head .t{font-size:12px;font-weight:600;color:var(--ink);}
.blk-head .s{font-size:11px;color:var(--ink50);}
.blk.bleed{padding:0;}
/* panel: hanya untuk tabel & list */
.panel{background:var(--raised);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;}
.panel .ph{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:baseline;justify-content:space-between;gap:10px;}

/* stat kecil — teks, tanpa kotak */
.stat .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink50);font-weight:600;}
.stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:2px;}
.stat .c{font-size:11px;color:var(--ink50);margin-top:2px;}
.dl{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:11px;}
.dl.p{color:var(--pos);} .dl.n{color:var(--crit);} .dl.f{color:var(--ink50);}

.tr{height:8px;border-radius:2px;background:var(--n100);overflow:hidden;position:relative;}
.tr>i{display:block;height:100%;background:var(--ink);}
.tr .tg{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--ink);}
.tr.s{height:6px;}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;display:inline-block;}
.dot.h{background:var(--crit);} .dot.m{background:var(--warn);} .dot.l{background:var(--info);}
.dot.ok{background:var(--pos);} .dot.off{background:var(--neut);}
.sev{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;}
.sev.h{color:var(--crit);} .sev.m{color:var(--warn);} .sev.l{color:var(--info);}
.sbar{display:flex;height:8px;border-radius:2px;overflow:hidden;background:var(--n100);}
.sbar i{display:block;height:100%;}
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:4px 0;font-size:12px;border-bottom:1px solid var(--n100);}
.kv:last-child{border-bottom:0;}
.kv .k{color:var(--ink50);}
.kv .v{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);}
.hr{height:1px;background:var(--bd);margin:10px 0;}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--ink50);}
.leg span{display:inline-flex;align-items:center;gap:5px;}
.foot{font-size:11px;color:var(--ink34);margin-top:8px;}
.micro{display:flex;align-items:center;gap:8px;}
svg{display:block;}

/* list (exception) */
.exc{display:grid;grid-template-columns:56px 1fr 78px 38px;gap:10px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--n100);}
.exc:last-child{border-bottom:0;}
.exc:hover{background:var(--n50);}
.exc .lb{font-size:12px;color:var(--ink);}
.exc .dc{font-family:var(--mono);font-size:11px;color:var(--ink50);}
.sla{height:5px;border-radius:2px;background:var(--n100);overflow:hidden;}
.sla>i{display:block;height:100%;}

/* tabel */
table.led{width:100%;border-collapse:collapse;font-size:12px;}
table.led th{text-align:left;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink50);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--bd-strong);white-space:nowrap;}
table.led td{padding:7px 10px;border-bottom:1px solid var(--n100);white-space:nowrap;}
table.led tr:hover td{background:var(--n50);}
table.led tfoot td{border-top:1px solid var(--bd-strong);font-weight:600;background:var(--sunken);color:var(--ink70);}
.hp{display:inline-flex;align-items:center;gap:5px;font-size:11px;}
.mbar{display:flex;height:8px;width:96px;border-radius:2px;overflow:hidden;background:var(--n100);}
.mbar i{display:block;height:100%;}
.ratio{display:inline-flex;gap:1px;}
.ratio i{width:4px;height:11px;border-radius:1px;background:var(--n200);}
.ratio i.f{background:var(--pos);} .ratio i.f.bad{background:var(--crit);}
.riskb{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:3px;color:#fff;font-size:9px;font-family:var(--mono);}
.heat{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;}
.heat i{aspect-ratio:1;border-radius:2px;display:block;}
.funnel .st{display:flex;align-items:center;gap:8px;font-size:11px;margin-bottom:4px;}
.funnel .nm{width:74px;color:var(--ink50);}
.funnel .br{height:15px;background:var(--ink);border-radius:2px;}
.funnel .vv{font-family:var(--mono);font-size:11px;color:var(--ink70);width:50px;text-align:right;}

/* live */
.fl-up{animation:flu .9s ease-out;} .fl-dn{animation:fld .9s ease-out;}
@keyframes flu{0%{background:var(--pos-tint)}100%{background:transparent}}
@keyframes fld{0%{background:var(--crit-tint)}100%{background:transparent}}
.val{display:inline-block;padding:0 3px;margin:0 -3px;border-radius:3px;}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(34,197,94,.45)}70%{box-shadow:0 0 0 6px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.live .b{animation:beat 1.8s infinite;}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50;}
.toast{background:var(--raised);border:1px solid var(--bd-strong);border-left:3px solid var(--brand);border-radius:4px;padding:9px 12px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);max-width:320px;}
@media (prefers-reduced-motion: reduce){.fl-up,.fl-dn{animation:none;}.live .b{animation:none;}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="mk">AEC</span><b>AEC</b></div>
    <nav class="nav">
      <div class="g">Main</div>
      <a class="on" href="#">Dashboard</a><a href="#">Executive Analytics</a><a href="#">Advanced Reporting</a>
      <a href="#">Approval <span class="n">12</span></a><a href="#">Workflow</a>
      <div class="g">Project &amp; Engineering</div>
      <a href="#">Projects</a><a href="#">WBS</a><a href="#">Budget</a><a href="#">Project Health</a>
      <div class="g">Finance &amp; Treasury</div>
      <a href="#">Client Invoice</a><a href="#">Vendor Invoice</a><a href="#">Treasury</a>
      <div class="g">Governance</div>
      <a href="#">HSE</a><a href="#">Quality</a><a href="#">Governance</a>
    </nav>
    <div class="ft">AEC ERP v0.1.0</div>
  </aside>
  <div class="main">
    <div class="bar">
      <button class="ico" aria-label="Open menu">☰</button>
      <nav class="crumb"><span class="p">Main</span><span class="s">›</span><span class="c">Dashboard</span></nav>
      <span class="chip env">DEMO</span><span class="chip k">AEC Group</span><span class="chip k">FY2026 · Q1</span>
      <span class="grow"></span>
      <span class="live" id="liveind"><span class="b"></span>LIVE</span>
      <button class="ico" aria-label="Notifications">◔<span class="nb">12</span></button>
      <button class="ico" aria-label="Command palette"><span class="mono" style="font-size:11px">⌘K</span></button>
      <button class="ico" aria-label="Help">?</button>
      <span class="av">AR</span>
    </div>
    <div class="wrap" id="root"></div>
  </div>
</div>
<script src="./mockup-v3-script.js"></script>
</body>
